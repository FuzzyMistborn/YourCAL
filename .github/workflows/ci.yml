name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        # --legacy-peer-deps: typescript-eslint doesn't support TypeScript 7
        # yet (peer dep caps at <6.1.0). See AGENTS.md "Toolchain: TypeScript
        # 7 vs. @typescript-eslint" for why we're not pinning TS back down.
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
