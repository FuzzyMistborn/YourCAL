services:
  yourcal:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Required: 32 random bytes, hex-encoded (`openssl rand -hex 32`).
      # @fastify/secure-session (server/src/session.ts) decodes this
      # directly as raw key bytes -- anything else fails at startup with
      # "key must be 32 bytes".
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET to the output of `openssl rand -hex 32}
      # Comma-separated allowlist of CalDAV server hostnames this app is
      # permitted to talk to -- see server/src/dav/hostAllowlist.ts. Unset
      # (the default) allows any host, which is fine for a trusted personal
      # instance but worth locking down if this is reachable more broadly.
      ALLOWED_CALDAV_HOSTS: ${ALLOWED_CALDAV_HOSTS:-}
      # How long a login lasts, in seconds (default 86400 = 24h) -- sets
      # both the cookie's Max-Age and @fastify/secure-session's own
      # server-side expiry check (server/src/session.ts), kept in sync so
      # the cookie doesn't outlive (or expire well before) the session
      # payload it carries.
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      CACHE_ENABLED: ${CACHE_ENABLED:-false}
      SQLITE_PATH: /app/data/cache.db
      CACHE_SYNC_TTL_MS: ${CACHE_SYNC_TTL_MS:-30000}
      # NODE_ENV=production (set in the Dockerfile) marks the session
      # cookie Secure (server/src/session.ts) -- browsers will refuse to
      # send it over plain HTTP. Put a TLS-terminating reverse proxy in
      # front for anything beyond localhost/a trusted LAN, or override this
      # to a non-"production" value here if you understand the tradeoff
      # (session cookie sent over plain HTTP).
      # NODE_ENV: development
    volumes:
      # Only load-bearing when CACHE_ENABLED=true -- otherwise DavCalendarStore
      # is used directly with no local state to persist (see AGENTS.md's
      # "SQLite read-cache" section).
      - yourcal-data:/app/data
    restart: unless-stopped

volumes:
  yourcal-data:
