<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YourCal</title>
    <script>
      // Set the theme before first paint so a dark-mode user doesn't get a
      // flash of the light theme while the bundle loads. Mirrors
      // applyTheme() in src/stores/settings.ts, which takes over from here.
      try {
        var t = localStorage.getItem('calendar.theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
